[project]
name = "ce-brain"
version = "0.1.0"
description = "CE-BRAIN: testing on registered data whether memory and learning on fixed neurons are history-dependent relations and traces; the Riemannian metric is a hypothesis under test"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=16",
    "h5py>=3.10",
    "remfile>=0.1",
    "cefast",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
cefast = { path = "research/fast" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
