[project]
name = "ce-agi-runtime"
version = "0.1.0"
description = "CE research consumers of the standalone Reality Stone library"
requires-python = ">=3.10,<3.13"
dependencies = [
    "reality_stone[llm]==0.3.0",
    "numpy>=1.24,<3",
    "tokenizers>=0.15,<1",
    "torch>=2.0",
    "tqdm>=4.66,<5",
    "transformers>=4.40,<6",
]

[project.optional-dependencies]
science = [
    "datasets>=2.18,<5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.13",
    "joblib>=1.3",
]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "qiskit-ibm-runtime>=0.20",
]
neuro = ["nibabel>=5.4"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = [
    "ce-agi-runtime[science,quantum,neuro,dev]",
]

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: tests that require CUDA kernels",
]
