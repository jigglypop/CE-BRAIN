sourcer:
  mode: novelty
  prior_art:
  - ref: Abbott LF, Dayan P (1999) The effect of correlated variability on the accuracy of a population code. Neural
      Computation 11(1):91-101
    relation: generalizes
    note: 문헌이 카드의 극한. (i) 자극의존 공분산 아래 2항 Fisher I = f'^T Q^-1 f' + (1/2)tr(Q'Q^-1 Q'Q^-1)는 카드 1단 I의 다변량 원형 -> 1단은
      identical, ladder_cited로 닫고 2단 진행(질문 park 아님). (ii) 신호와 잡음이 함께 커질 때 판별도 불변은 카드 recovers-2의 p=2 극한(dlogPhi/dlogmu=0).
      카드는 그 한 점을 p 전 구간으로 보간하고 (1-rho) 인자를 추가하므로 카드 전체는 재발견 아님. 식 번호 UNVERIFIED(1차 출처 미열람)
  - ref: Goris RLT, Movshon JA, Simoncelli EP (2014) Partitioning neuronal variability. Nature Neuroscience 17(6):858-865
    relation: generalizes
    note: 문헌이 카드의 특수사례. modulated Poisson의 sigma^2 = mu + sigma_G^2 mu^2는 카드가 p로 매개하는 상태함수 f(mu)의 한 인스턴스(p in (1,2))일
      뿐이고, 계량 Phi나 dlogPhi/dlogmu에 대한 진술은 없다. 변동-평균 멱법칙 자체는 확립(cf. Koyama arXiv:1409.7137)
  - ref: Ma WJ, Beck JM, Latham PE, Pouget A (2006) Bayesian inference with probabilistic population codes. Nature
      Neuroscience 9(11):1432-1438 (및 Poisson Fisher I = sum (f')^2/f 교과서 결과)
    relation: generalizes
    note: 문헌이 카드의 극한. Poisson-like 변동에서 Fisher가 gain에 선형이라는 표준 결과는 카드 지수 2-p의 p=1 점이다. 양 끝점 p=1, p=2가 각각 이미 알려져
      있으므로 카드의 신규성은 (a) p 전 구간 보간, (b) (1-rho) 인자, (c) 학습 전후 동차지수 대비 Lambda라는 estimand에 전적으로 걸린다. judge는 이 점을 채택
      근거에 명시할 것. 정리 번호 UNVERIFIED
  - ref: Churchland MM et al. (2010) Stimulus onset quenches neural variability. Nature Neuroscience 13(3):369-378
    relation: unrelated
    note: 선행연구가 아니라 반증원. mean-matched Fano 감소는 카드의 전제(sigma^2가 phase를 가로질러 같은 f(mu))를 위협하므로 novelty가 아니라 kill K1/W_hist
      근거로 분류해야 한다. 카드 5절이 이미 그렇게 쓰고 있어 일관적
  - ref: Kanitscheider I, Coen-Cagli R, Kohn A, Pouget A (2015) Measuring Fisher information accurately in correlated
      neural populations. PLoS Comput Biol 11(6):e1004218 [카드의 'PNAS 2015' 표기는 Kanitscheider, Coen-Cagli, Pouget
      (2015) PNAS 112(46):E6908과의 혼합]
    relation: unrelated
    note: estimand 불일치. 상관 집단에서 Fisher를 편의 없이 추정하는 방법론이며 단일 chart 축약계량의 gain 동차지수와는 다른 양. 서지 문자열만 교정 필요(claim 변경
      아님)
  - ref: Moreno-Bote R et al. (2014) Information-limiting correlations. Nature Neuroscience 17(10):1410-1417
    relation: unrelated
    note: estimand 불일치. differential correlations로 인한 Fisher의 N-포화를 다루며 카드는 1차원 축약이라 N-스케일링을 주장하지 않는다
  - ref: Gu Y et al. (2011) Neuron 71(4):750-761; Ni AM, Ruff DA, Alberts JJ, Symmonds J, Cohen MR (2018) Science
      359(6374):463-465
    relation: unrelated
    note: 같은 영역, 다른 양. 학습 전후 r_SC·집단 공유변동·행동 상관의 변화를 재며 카드의 Lambda를 잰 문헌은 확인되지 않음. 관측 근접은 증거가 아니므로 이 결과들을 카드 지지로
      쓰지 말 것
